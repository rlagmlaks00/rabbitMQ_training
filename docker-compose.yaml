version: '3.8'

services:
  rabbitmq1:
    image: rabbitmq:4.1-management
    hostname: rabbitmq1
    environment:
      - RABBITMQ_ERLANG_COOKIE=my_shared_secret_cookie   # 세 노드 모두 반드시 동일해야 함
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=change_me_in_prod
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq   # 볼륨 없으면 컨테이너 재시작 시 데이터 유실
    networks:
      - rabbitmq_cluster

  rabbitmq2:
    image: rabbitmq:4.1-management
    hostname: rabbitmq2
    environment:
      - RABBITMQ_ERLANG_COOKIE=my_shared_secret_cookie
    depends_on:
      - rabbitmq1
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
    networks:
      - rabbitmq_cluster
    command: >
      bash -c "
      rabbitmq-server -detached &&
      sleep 10 &&
      rabbitmqctl stop_app &&
      rabbitmqctl join_cluster rabbit@rabbitmq1 &&
      rabbitmqctl start_app &&
      tail -f /dev/null
      "

  rabbitmq3:
    image: rabbitmq:4.1-management
    hostname: rabbitmq3
    environment:
      - RABBITMQ_ERLANG_COOKIE=my_shared_secret_cookie
    depends_on:
      - rabbitmq1
    volumes:
      - rabbitmq3_data:/var/lib/rabbitmq
    networks:
      - rabbitmq_cluster
    command: >
      bash -c "
      rabbitmq-server -detached &&
      sleep 15 &&
      rabbitmqctl stop_app &&
      rabbitmqctl join_cluster rabbit@rabbitmq1 &&
      rabbitmqctl start_app &&
      tail -f /dev/null
      "

networks:
  rabbitmq_cluster:
    driver: bridge

volumes:
  rabbitmq1_data:
  rabbitmq2_data:
  rabbitmq3_data: