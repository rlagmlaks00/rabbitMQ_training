spring:
  rabbitmq:
    addresses: localhost:5672,localhost:5673,localhost:5674  # rabbitmq1,2,3 — 앞 노드가 죽으면 다음 주소로 페일오버
    username: guest
    password: guest

    listener:
      simple:
        # prefetch: 1  # 한 번에 1개씩만 배달 — 처리 중인 메시지 ack 전까지 나머지는 Ready로 대기
        retry:
          enabled: true
          max-attempts: 3          # 최대 3번 시도
          initial-interval: 1000ms # 첫 재시도까지 1초
          multiplier: 2.0          # 재시도마다 대기시간 2배씩 증가 (1s → 2s → 4s)
          max-interval: 10000ms    # 최대 대기시간 상한

  application:
    name: rabbitmq
